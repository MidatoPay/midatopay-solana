services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: midatopay-postgres-prod
    environment:
      POSTGRES_DB: midatopay
      POSTGRES_USER: midatopay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - midatopay-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midatopay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midatopay-backend-prod
    env_file:
      - ./backend/.env
    # DATABASE_URL solo en backend/.env (no interpolar POSTGRES_PASSWORD aquí: caracteres como @ : / #
    # rompen el URL y Prisma devuelve P1013 "invalid port number"). Host debe ser el servicio: postgres
    # Ej. postgresql://midatopay:CONTRASE%C3%91A@postgres:5432/midatopay — codificar con encodeURIComponent.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    # Keypair Solana (admin): NO va en Git. En el host: chmod 600 y chown 1001:1001.
    # En backend/.env: SOLANA_WALLET_PATH=/app/secrets/solana-keypair.json
    volumes:
      - ${SOLANA_KEYPAIR_HOST_PATH:-/home/ubuntu/.secrets/midatopay-solana-keypair.json}:/app/secrets/solana-keypair.json:ro
    networks:
      - midatopay-network-prod
    restart: unless-stopped
    command: npm start
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://midatopay.com}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://midatopay.com/ws}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: midatopay-frontend-prod
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    # En producción, NO montar volúmenes de código
    # Solo se usa la imagen construida
    # volumes:
    #   - ./frontend:/app  # ❌ NO en producción
    #   - /app/node_modules
    #   - /app/.next
    networks:
      - midatopay-network-prod
    restart: unless-stopped
    command: npm start
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_prod:

networks:
  midatopay-network-prod:
    driver: bridge

